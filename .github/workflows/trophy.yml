name: Generate GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test token
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "PAT_TOKEN is EMPTY"; exit 1; fi
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" https://api.github.com/user

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: amriiiita07-ui
          file: trophy.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Commit trophy.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "Update trophy.svg"
          git push
