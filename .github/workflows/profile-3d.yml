name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: amriiiita07-ui
          SETTING_JSON: '{"githubUserName":"amriiiita07-ui","themeContext":[{"themeName":"night_rainbow"}]}'
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Commit & Push
        run: |
          git config user.email "amriiiita.07@gmail.com"
          git config user.name "amriiiita07-ui"
          git add -A .
          git commit -m "update 3D contribution graph" || true
          git push
